# Fixtures for kyverno-test.yaml. Only the image references matter; the pods
# are never created.
#
# Two published releases, and both have to stay in the registry. A release tag
# is kept on purpose, which is why neither fixture is a snapshot:
#
#   v0.8.0   released before this project signed anything, so unsigned for
#            good. 4346c686… is its index digest.
#   v0.9.0   the first signed release, by
#            https://github.com/stuttgart-things/schmetterpause/.github/workflows/ci.yml@refs/tags/v0.9.0.
#            9cd942f3… is its index digest.
---
apiVersion: v1
kind: Pod
metadata:
  name: unsigned-by-tag
  namespace: schmetterpause
spec:
  containers:
    - name: app
      image: ghcr.io/stuttgart-things/schmetterpause:v0.8.0
---
apiVersion: v1
kind: Pod
metadata:
  name: unsigned-by-digest
  namespace: schmetterpause
spec:
  containers:
    - name: app
      image: ghcr.io/stuttgart-things/schmetterpause@sha256:4346c6865e5d3b7c0def05ff5d9cb866c4ae26612d608c2eeed455810216244c
---
apiVersion: v1
kind: Pod
metadata:
  name: unsigned-tag-and-digest
  namespace: schmetterpause
spec:
  containers:
    - name: app
      image: ghcr.io/stuttgart-things/schmetterpause:v0.8.0@sha256:4346c6865e5d3b7c0def05ff5d9cb866c4ae26612d608c2eeed455810216244c
---
apiVersion: v1
kind: Pod
metadata:
  name: unsigned-init-container
  namespace: schmetterpause
spec:
