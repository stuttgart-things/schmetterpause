# The office cluster: HTTPRoute against the shared Cilium gateway, secrets from
# Vault through External Secrets.
#
# The hostname is assembled from name and clusterDomain, so moving to another
# cluster is one value here rather than an edit in the manifests.
kcl_options:
  - key: config.namespace
    value: schmetterpause

  # Pin a digest for a real deploy. :latest is here so the profile renders
  # before the first release exists.
  - key: config.image
    value: ghcr.io/stuttgart-things/schmetterpause:latest

  - key: config.clusterDomain
    value: cicd-test2.4sthings.tiab.ssc.sva.de

  - key: config.httpRouteEnabled
    value: true
  - key: config.gatewayName
    value: cilium-gateway
  - key: config.gatewayNamespace
    value: default

  # The kiosk stays off. On a server "trust comes from the room" no longer
  # holds — see issue #90 — and the measured days are meant to run without one.
  - key: config.kioskEnabled
    value: false

  - key: config.secretsMode
    value: external
  - key: config.secretStoreKind
    value: ClusterSecretStore
  - key: config.secretStoreName
    value: vault
  - key: config.vaultPath
    value: schmetterpause/data/cicd-test2
