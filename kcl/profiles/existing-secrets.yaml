# The same application on a cluster without the External Secrets Operator.
#
# Nothing changes for the Deployment: it reads <name>-app and <name>-db by name
# either way. Only the two ExternalSecrets stop being rendered — something else
# puts the Secrets in place: task kcl:secrets, sealed secrets, another
# operator, a kubectl by hand.
#
# Otherwise identical to base.yaml, placeholders included. A field left out
# here is not filled in from base.yaml; it falls back to its default in
# schema.k, and those are deliberately the reticent ones.
config.namespace: schmetterpause
config.image: ghcr.io/stuttgart-things/schmetterpause:latest

config.secretsMode: existing

# PATCH: the same three decisions base.yaml documents.
config.clusterDomain: cluster.example.com
config.httpRouteEnabled: true
config.gatewayName: gateway
config.gatewayNamespace: default

config.kioskEnabled: false
