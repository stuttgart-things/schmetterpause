version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    # Errors are wrapped, not swallowed (CLAUDE.md, "Konventionen").
    - errorlint
    - bodyclose
    # misspell stays off: the German user-facing strings and the German
    # documentation quoted in comments trip it up.
    - unconvert
    - revive
  settings:
    errcheck:
      check-type-assertions: true
    revive:
      rules:
        - name: exported
        - name: error-strings
        - name: context-as-argument
  exclusions:
    generated: lax
    paths:
      # Generated by templ; not maintained by hand.
      - ".*_templ\\.go$"
      # Generated by Dagger.
      - "dagger/internal"
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/stuttgart-things/schmetterpause
  exclusions:
    generated: lax
    paths:
      - ".*_templ\\.go$"
      - "dagger/internal"
