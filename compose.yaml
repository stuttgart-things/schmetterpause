# Local development environment: application and Postgres, nothing else.
#
# No Redis — see docs/adr/0002. The application reads its entire configuration
# from SP_* variables; the same image runs unchanged in K8s and ACA.

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: schmetterpause
      POSTGRES_PASSWORD: schmetterpause
      POSTGRES_DB: schmetterpause
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Loopback only, so the development database is not exposed to the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schmetterpause -d schmetterpause"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    # No build stanza: the image comes from ko, which is the only build path
    # there is (invariant 1, docs/adr/0009). "task up" builds it into the
    # local Docker daemon beforehand. SP_IMAGE points the stack at a published
    # image instead — a ttl.sh reference somebody handed over, or the GHCR one
    # for an evening in the office.
    image: ${SP_IMAGE:-schmetterpause:dev}
    environment:
      SP_DATABASE_URL: postgres://schmetterpause:schmetterpause@db:5432/schmetterpause?sslmode=disable
      SP_LOG_LEVEL: ${SP_LOG_LEVEL:-debug}
      # Fixed so a restart does not turn every player into a stranger. A
      # development value on purpose — anything real belongs in a secret.
      SP_SESSION_KEY: ${SP_SESSION_KEY:-development-session-key-not-for-production}
      # No HTTPS on http://localhost, so the browser would never send a
      # cookie marked Secure.
      SP_COOKIE_SECURE: "false"
      # Empty by default, and then the kiosk does not exist. Start it with
      # SP_KIOSK_TOKEN=... task up for an evening where one machine at the
      # table enters everybody's results.
      SP_KIOSK_TOKEN: ${SP_KIOSK_TOKEN:-}
      # Empty by default, and then nobody is an admin. Start it with
      # SP_BOOTSTRAP_ADMIN="Anna" task up to give that player the flag; the
      # name is the one on the ranking (docs/adr/0008).
      SP_BOOTSTRAP_ADMIN: ${SP_BOOTSTRAP_ADMIN:-}
      # SP_PUBLIC_BASE_URL is deliberately unset: the QR sheet reads the
      # address off the request, which is right wherever the application is
      # reached directly. Set it where a proxy terminates TLS or rewrites the
      # host, because there the request no longer says where a phone has to go.
    ports:
      # Loopback by default: a development machine has no business answering
      # the whole network. compose.office.yaml is started with 0.0.0.0 here,
      # which is the one case where it does.
      - "${SP_BIND_ADDR:-127.0.0.1}:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The distroless image has no shell and no curl — the binary brings the
      # check along itself.
      test: ["CMD", "/ko-app/schmetterpause", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
