# The documentation site, published to GitHub Pages by
# .github/workflows/pages.yml. Two properties of the shared workflow that
# builds it shape this file, and neither is obvious from the file itself:
#
# 1. It parses this file with yaml.safe_load. The usual way to switch on
#    Material's Mermaid rendering is a "!!python/name:" tag under
#    pymdownx.superfences, and that tag makes safe_load raise — the deploy
#    would then fail before MkDocs is ever called. So there is no Mermaid
#    here. A diagram stays a fenced code block or an image until the template
#    can load a full-tag YAML.
#
# 2. It replaces "theme" wholesale with its own Material block and drops every
#    plugin but search. So the theme below is what "task docs:serve" renders
#    on a laptop, not what the published site looks like, and no plugin may be
#    load-bearing: an ADR index built by a plugin would exist locally and be
#    missing from the site. That is why scripts/adr_index.sh writes a real
#    file instead.
#
# The nav lists every ADR by hand, which is exactly the kind of thing that
# drifts — so scripts/docs_test.sh fails the build when an ADR is missing from
# it, or when the nav names a page nobody wrote.
site_name: Schmetterpause
site_description: Matchmaking, Liga und Turnier für Büro-Tischtennis
site_url: https://stuttgart-things.github.io/schmetterpause/
repo_url: https://github.com/stuttgart-things/schmetterpause
repo_name: stuttgart-things/schmetterpause
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: de
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true

nav:
  - Loslegen: index.md
  - Turnier vor Ort: turnier-vor-ort.md
  - Plan:
      - MVP-Plan: mvp-plan.md
      - Maskottchen-Briefing: maskottchen-briefing.md
  - Entscheidungen:
      - Übersicht: adr/index.md
      - ADR-0001 Postgres als Datenbank: adr/0001-postgres-als-datenbank.md
      - ADR-0002 Kein Redis: adr/0002-kein-redis.md
      - ADR-0003 Identitäten in eigener Tabelle: adr/0003-identitaeten-eigene-tabelle.md
      - ADR-0004 WebAuthn, keine serverseitige Biometrie: adr/0004-webauthn-keine-serverseitige-biometrie.md
      - ADR-0005 Kubernetes CRDs als Datenspeicher: adr/0005-kubernetes-crds-als-datenspeicher.md
      - ADR-0006 Wiederherstellungscode: adr/0006-wiederherstellungscode.md
      - ADR-0007 PIN als Anmeldung: adr/0007-pin-als-anmeldung.md
      - ADR-0008 Wer für andere handeln darf: adr/0008-wer-fuer-andere-handeln-darf.md
      - ADR-0009 Schnelles Turnier wertet pro Match: adr/0009-schnelles-turnier-wertet-pro-match.md
      - ADR-0010 Turnierergebnisse vom eigenen Handy: adr/0010-turnierergebnisse-vom-eigenen-handy.md
      - ADR-0011 Finale und Rückspiele: adr/0011-finale-und-rueckspiele.md
      - ADR-0012 Turnier ohne Wertung: adr/0012-turnier-ohne-wertung.md
      - ADR-0013 Turnierseiten und erster Aufschlag: adr/0013-turnierseiten-und-erster-aufschlag.md
      - ADR-0014 Kiosk benennt, wer einträgt: adr/0014-kiosk-benennt-wer-eintraegt.md
  - Betrieb:
      - Deployment ohne GitOps: deployment.md
