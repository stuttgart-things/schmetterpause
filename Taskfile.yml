# Task is the entry layer for humans: every command someone types is a task.
# The build logic does not live here but in Dagger — which is why lint, build,
# verify and ci do nothing but call "dagger call".
version: '3'

vars:
  MODULE: github.com/stuttgart-things/schmetterpause
  # DSN for the Compose database when tools reach it from the host.
  DSN: postgres://schmetterpause:schmetterpause@127.0.0.1:5432/schmetterpause?sslmode=disable
  # And the one the integration tests empty. A database of its own on the same
  # server, because the one above is the database the office plays on:
  # compose.office.yaml is an overlay on the same `db` service, so `task up`
  # and `task office:up` share a volume and a port (issue #163). The name has
  # to end in _test or TruncateAll refuses to empty it.
  TEST_DB: schmetterpause_test
  DSN_TEST: postgres://schmetterpause:schmetterpause@127.0.0.1:5432/{{.TEST_DB}}?sslmode=disable
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  # The commit's own date, not the clock. Two builds of one commit have to be
  # able to say they are the same thing, which a build timestamp would make
  # impossible.
  COMMIT_TIME:
    sh: git show -s --format=%cI HEAD 2>/dev/null || true
  # Development only. Fixed so a restart keeps recognising the same browser.
  DEV_SESSION_KEY: development-session-key-not-for-production
  # Pinned. An unpinned module means "task kcl:publish" can render something
  # different tomorrow than it did today, which is the one property a deploy
  # artefact must not have.
  KCL_MODULE: github.com/stuttgart-things/dagger/kcl@v0.82.0
  KUSTOMIZE_OCI_REPO: ghcr.io/stuttgart-things/schmetterpause-kustomize
  IMAGE_REPO: ghcr.io/stuttgart-things/schmetterpause

tasks:
  default:
    desc: "List the available tasks"
    cmds:
      - task --list
    silent: true

  # ------------------------------------------------------------- Operations

  up:
    desc: "Start the Compose environment (app + Postgres)"
    cmds:
      - task: compose:up
        vars: { SERVICES: "" }
      - 'echo "Schmetterpause is running on http://127.0.0.1:8080"'

  image:local:
    desc: "Build the working tree as schmetterpause:dev and load it into Docker"
    deps: [dagger:check]
    silent: true
    cmds:
      - mkdir -p build
      - |
        set -eu

        # Docker media types rather than the OCI default: "docker load" reads
        # a docker-archive, not an OCI layout, and refuses the latter with an
        # error about a missing manifest.json that says nothing about why.
        dagger call image \
          --source=. \
          --version={{.VERSION}} \
          --commit-time="{{.COMMIT_TIME}}" \
          export --path=build/schmetterpause-docker.tar --media-types=dockermediatypes

        # The export carries no repository tag, so docker load prints an id
        # and nothing else. Both of its output forms are read, because which
        # one appears depends on whether the archive names the image.
        loaded=$(docker load --input build/schmetterpause-docker.tar)
        echo "${loaded}"

        ref=$(printf '%s\n' "${loaded}" | sed -n 's/^Loaded image ID: //p' | tail -1)
        [ -n "${ref}" ] || ref=$(printf '%s\n' "${loaded}" | sed -n 's/^Loaded image: //p' | tail -1)

        if [ -z "${ref}" ]; then
          echo "docker load printed neither an image id nor an image name" >&2
          exit 1
        fi

        docker tag "${ref}" schmetterpause:dev
        echo "tagged schmetterpause:dev ({{.VERSION}})"

  up:local:
    desc: "Start Compose against the locally built image instead of the released one"
    deps: [image:local]
    silent: true
    cmds:
      - docker compose -f compose.yaml -f compose.dev.yaml up --detach --wait
      - 'echo "Schmetterpause {{.VERSION}} is running on http://127.0.0.1:8080"'

  down:
    desc: "Stop the Compose environment and discard the development data"
    cmds:
      - docker compose down --volumes --remove-orphans

  logs:
    desc: "Follow the application logs"
    cmds:
      - docker compose logs --follow app

  run:
    desc: "Run the app locally against the Compose database (no app container)"
    deps: [generate]
    env:
      SP_DATABASE_URL: '{{.DSN}}'
      SP_LOG_LEVEL: debug
      SP_SESSION_KEY: '{{.DEV_SESSION_KEY}}'
      SP_COOKIE_SECURE: "false"
    cmds:
      - task: compose:up
        vars: { SERVICES: db }
      - go run ./cmd/schmetterpause serve

  # --------------------------------------------------------- Event on site
  # One laptop at the table, everybody else on their phone. The walkthrough
  # is in docs/turnier-vor-ort.md.

  office:ip:
    desc: "Show the addresses this machine answers on, for SP_PUBLIC_BASE_URL"
    silent: true
    cmds:
      - sh scripts/addresses.sh
      - |
        echo
        echo "task office:setup writes .env for you, or set the three by hand:"
        echo "SP_PUBLIC_BASE_URL=http://<address>:8080 SP_KIOSK_TOKEN=... SP_SESSION_KEY=... task office:up"

  office:setup:
    desc: "Fill .env for an evening: address, kiosk token, session key, admin"
    # The address is the one value a typo ruins silently: it is printed into
    # the QR code, and nobody finds out until a phone lands nowhere. So it is
    # picked from a list rather than typed.
    #
    # The admin may stay empty. Nothing at the table needs one — but taking a
    # kiosk machine back during the evening does, and that is not a thing to
    # discover while somebody is standing next to you (docs/adr/0008).
    interactive: true
    silent: true
    cmds:
      - |
        if [ -f .env ]; then
          if command -v gum >/dev/null 2>&1; then
            gum confirm ".env exists. Overwrite it?" || { echo "Kept the existing .env."; exit 0; }
          else
            printf '.env exists. Overwrite it? [y/N] '
            read -r reply
            case "$reply" in [yYjJ]*) ;; *) echo "Kept the existing .env."; exit 0 ;; esac
          fi
        fi

        addresses=$(sh scripts/addresses.sh)
        [ -n "$addresses" ] || { echo "No address found." >&2; exit 1; }

        # gum where it is installed, plain read where it is not: the evening
        # must not depend on a tool nobody remembered to bring.
        if command -v gum >/dev/null 2>&1; then
          picked=$(printf '%s\n' "$addresses" | gum choose --header "Which address do the phones reach?")
          token=$(gum input --header "Kiosk token" --value "turnier")
          admin=$(gum input --header "Admin (display name, may stay empty)" --placeholder "the name they join under")
        else
          echo "Addresses this machine answers on:"
          printf '%s\n' "$addresses" | nl -w2 -s'  '
          printf 'Number of the address the phones reach: '
          read -r n
          picked=$(printf '%s\n' "$addresses" | sed -n "${n}p")
          printf 'Kiosk token [turnier]: '
          read -r token
          printf 'Admin, display name (empty for none): '
          read -r admin
        fi

        [ -n "${picked:-}" ] || { echo "Nothing picked." >&2; exit 1; }
        address=$(printf '%s' "$picked" | awk '{print $NF}')
        token=${token:-turnier}

        key=$(openssl rand -hex 32 2>/dev/null || head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')

        # Not umask: Task runs these through its own shell interpreter, which
        # has no umask builtin. Create the file empty, narrow it, then write —
        # the session key is never briefly world-readable.
        : > .env
        chmod 600 .env
        cat >> .env <<ENV
        SP_PUBLIC_BASE_URL=http://$address:8080
        SP_KIOSK_TOKEN=$token
        SP_SESSION_KEY=$key
        SP_BOOTSTRAP_ADMIN=${admin:-}
        ENV

        echo
        echo "Written .env"
        echo "  everybody:  http://$address:8080/"
        echo "  the sheet:  http://$address:8080/qr"
        echo "  the rules:  http://$address:8080/rules"
        echo "  the table:  http://$address:8080/kiosk?token=$token"
        if [ -n "${admin:-}" ]; then
          echo
          # The flag is granted at startup and only to somebody who already
          # exists, so the order is join first, restart second. Saying it here
          # is cheaper than finding it out at the table (docs/adr/0008).
          echo "Admin: $admin — they have to join first, then 'task office:up'"
          echo "       again before the flag is granted."
        fi
        echo
        echo "Next: task office:up"

  office:up:
    desc: "Start for the office: reachable on the network, kiosk unlocked"
    silent: true
    # Compose reads .env by itself; this is so the summary below sees the same
    # values rather than three empty lines.
    dotenv: ['.env']
    env:
      # The one case where the app answers on every interface rather than on
      # loopback: the phones are not on this machine.
      SP_BIND_ADDR: 0.0.0.0
    cmds:
      # The released image, pinned in compose.yaml — so the evening runs the
      # artefact CI built and Trivy scanned, and /info says which one.
      - docker compose -f compose.yaml -f compose.office.yaml up --detach --wait
      - |
        echo
        echo "Ranking and result entry:  $SP_PUBLIC_BASE_URL/"
        echo "Sheet to print and tape up: $SP_PUBLIC_BASE_URL/qr"
        echo "House rules, same again:    $SP_PUBLIC_BASE_URL/rules"
        echo "Machine at the table, once: $SP_PUBLIC_BASE_URL/kiosk?token=$SP_KIOSK_TOKEN"

  office:stop:
    desc: "Stop the event stack and keep every result"
    silent: true
    cmds:
      # The base file only: the overlay insists on the three variables, and
      # having to produce a session key in order to stop something is exactly
      # the wrong moment to look one up.
      - docker compose stop
      - 'echo "Stopped. task office:up brings it back with the data intact."'

  office:backup:
    desc: "Write the tournament database to a file"
    silent: true
    cmds:
      # Named by the moment, not by the code version: what matters afterwards
      # is which evening this was.
      - 'docker compose exec -T db pg_dump -U schmetterpause schmetterpause > schmetterpause-{{now | date "2006-01-02-1504"}}.sql'
      - 'echo "Written: schmetterpause-{{now | date "2006-01-02-1504"}}.sql"'

  office:check:
    desc: "Check the address script against macOS and Linux"
    silent: true
    cmds:
      - sh scripts/addresses_test.sh

  office:dod:
    desc: "Read the Definition of Done out of the database: 5 working days, 10 matches, 5 players"
    silent: true
    vars:
      # Kiosk entries are excluded by the query itself since #71, so a
      # tournament no longer has to be cut out by hand. SINCE is still here
      # for the case no column can see: an evening everybody entered from
      # their own phone because a schedule told them to.
      SINCE: '{{.SINCE | default "1970-01-01"}}'
      # Grouping into days only means something in the office's own time.
      ZONE: '{{.ZONE | default "Europe/Berlin"}}'
    cmds:
      - |
        docker compose exec -T db \
          psql -U schmetterpause -d schmetterpause \
          -v since='{{.SINCE}}' -v zone='{{.ZONE}}' \
          -f - < scripts/definition-of-done.sql
      - |
        echo "Counting from {{.SINCE}} in {{.ZONE}}."
        echo "Kiosk entries do not count towards the verdict; they are listed per day."
        echo "For an evening everybody typed in themselves: task office:dod SINCE=<the day after>"

  # ---------------------------------------------------------------- Manifests

  kcl:render:
    desc: "Render the manifests (PROFILE=base, ENTRY=kcl/main.k; extra -D after --)"
    vars:
      PROFILE: '{{.PROFILE | default "base"}}'
      ENTRY: '{{.ENTRY | default "kcl/main.k"}}'
    cmds:
      - |
        set -e

        # PROFILE takes either a name from kcl/profiles or a path to a file
        # anywhere. The path form is what an environment uses: a profile that
        # names a cluster has no business in this repository, and keeping it
        # outside is what lets the published base stay neutral.
        case "{{.PROFILE}}" in
          */*|*.yaml|*.yml) profile="{{.PROFILE}}" ;;
          *)                profile="kcl/profiles/{{.PROFILE}}.yaml" ;;
        esac
        case "${profile}" in
          "~/"*) profile="${HOME}/${profile#\~/}" ;;
        esac
        [ -f "${profile}" ] || { echo "no profile at ${profile}" >&2; exit 1; }

        # The same conversion stuttgart-things/dagger/kcl does inside its
        # container: a flat key/value file becomes one -D flag per entry. Doing
        # it identically here is the point — a profile that renders locally is
        # then a profile that renders in the publish chain.
        set --
        while IFS= read -r kv; do
          [ -n "${kv}" ] && set -- "$@" -D "${kv}"
        done <<PARAMS
        $(yq eval -o=json "${profile}" | jq -r 'to_entries[] | .key + "=" + (.value|tostring)')
        PARAMS

        # And the same normalisation it applies afterwards: drop the
        # "manifests:" key line, turn each list item into a document separator,
        # de-indent by two. Without it the local render is a different artefact
        # from the one that ships.
        # Anything after "--" lands here, AFTER the profile's flags, and a
        # later -D wins. That is what makes an environment a profile plus a
        # handful of overrides rather than a hand-assembled command line:
        #
        #   task kcl:render -- -D config.gatewayName=cilium-gateway
        #
        # Rendering with bare "kcl run -D ..." and no profile is the trap this
        # exists to remove — every field left out then falls back to its schema
        # default, which for secretsMode and httpRouteEnabled is deliberately
        # not what any cluster wants.
        kcl run {{.ENTRY}} "$@" {{.CLI_ARGS}} \
          | sed 's/^- /---\n/' \
          | sed '1d' \
          | sed 's/^  //' \
          | sed '/^[[:space:]]*$/d' \
          | awk 'NR==1{print "---"} 1'
    silent: true

  kcl:apply:
    desc: "Render and apply to the current kube-context (PROFILE=base, ENTRY=kcl/main.k; extra -D after --)"
    vars:
      PROFILE: '{{.PROFILE | default "base"}}'
      ENTRY: '{{.ENTRY | default "kcl/main.k"}}'
    cmds:
      # The context is printed rather than pinned: this applies wherever
      # kubectl currently points, and that is worth reading before it happens.
      - |
        set -e
        echo "context: $(kubectl config current-context)"
        task kcl:render PROFILE="{{.PROFILE}}" ENTRY="{{.ENTRY}}" -- {{.CLI_ARGS}} | kubectl apply -f -
    silent: true

  kcl:database:
    desc: "Render the CloudNativePG Cluster (PROFILE=base; extra -D after --)"
    vars:
      PROFILE: '{{.PROFILE | default "base"}}'
    cmds:
      # A separate entry point, not part of main.k: kcl:publish renders main.k,
      # so the Cluster cannot end up in the published base. See kcl/database.k.
      - task kcl:render PROFILE="{{.PROFILE}}" ENTRY=kcl/database.k -- {{.CLI_ARGS}}
    silent: true

  kcl:up:
    desc: "Namespace, application and database in one apply (PROFILE=base; extra -D after --)"
    vars:
      PROFILE: '{{.PROFILE | default "base"}}'
    cmds:
      - |
        set -e
        echo "context: $(kubectl config current-context)"

        app=$(mktemp) && db=$(mktemp)
        trap 'rm -f "${app}" "${db}"' EXIT
        task kcl:render PROFILE="{{.PROFILE}}" -- {{.CLI_ARGS}} > "${app}"
        task kcl:database PROFILE="{{.PROFILE}}" -- {{.CLI_ARGS}} > "${db}"

        # Read back what was rendered rather than taking them as task
        # variables: then an override passed after -- cannot move the
        # application without moving where this looks for it.
        ns=$(yq eval -N 'select(.kind == "ConfigMap") | .metadata.namespace' "${app}")
        name=$(yq eval -N 'select(.kind == "Deployment") | .metadata.name' "${app}")

        kubectl create namespace "${ns}" --dry-run=client -o yaml | kubectl apply -f -
        kubectl apply -f "${app}"

        # The Cluster goes last, and this is the wait that makes one command
        # honest. CloudNativePG reads the owner credentials from ${name}-db at
        # initdb; in secretsMode=external that Secret does not exist at apply
        # time but a few seconds later, once the ExternalSecret has synced.
        # Applying the Cluster into that gap depends on the operator retrying,
        # which is a thing to rely on rather than a thing to know.
        echo "waiting for secret ${name}-db in ${ns}"
        for _ in $(seq 1 60); do
          kubectl -n "${ns}" get secret "${name}-db" > /dev/null 2>&1 && break
          sleep 2
        done
        if ! kubectl -n "${ns}" get secret "${name}-db" > /dev/null 2>&1; then
          echo "secret ${name}-db never appeared." >&2
          echo "  secretsMode=external: kubectl -n ${ns} get externalsecret" >&2
          echo "  secretsMode=existing: task kcl:secrets NAMESPACE=${ns}" >&2
          exit 1
        fi

        kubectl apply -f "${db}"
        echo
        echo "kubectl -n ${ns} get cluster,po"
    silent: true

  kcl:secrets:
    desc: "Create the two Secrets by hand, for a cluster without External Secrets"
    vars:
      NAME: '{{.NAME | default "schmetterpause"}}'
      NAMESPACE: '{{.NAMESPACE | default "schmetterpause"}}'
      DB_NAME: '{{.DB_NAME | default "schmetterpause"}}'
      DB_CLUSTER: '{{.DB_CLUSTER | default "schmetterpause-db"}}'
      DB_PORT: '{{.DB_PORT | default "5432"}}'
      SSLMODE: '{{.SSLMODE | default "require"}}'
      KIOSK: '{{.KIOSK | default "false"}}'
    cmds:
      - |
        set -e
        ns="{{.NAMESPACE}}"

        # "create", never "apply". Re-running this must not quietly mint a new
        # session key: that does not fail, it logs every player out and hands
        # them a stranger's view of their own account. Existing Secrets make
        # this abort, which is the outcome we want.
        session_key=$(openssl rand -base64 32)

        # Hex, not base64. The password is interpolated into a URL unescaped,
        # and an @ / : or ? in it makes the DSN parse as something else.
        password=$(openssl rand -hex 24)

        # Identical to the host labels.k computes, and to the one the
        # ExternalSecret template builds in the other mode.
        dsn="postgresql://{{.NAME}}:${password}@{{.DB_CLUSTER}}-rw.${ns}.svc:{{.DB_PORT}}/{{.DB_NAME}}?sslmode={{.SSLMODE}}"

        kiosk=""
        if [ "{{.KIOSK}}" = "true" ]; then
          kiosk="--from-literal=SP_KIOSK_TOKEN=$(openssl rand -hex 32)"
        fi

        kubectl -n "${ns}" create secret generic "{{.NAME}}-app" \
          --from-literal=SP_SESSION_KEY="${session_key}" ${kiosk}

        # basic-auth with username and password because CloudNativePG reads the
        # owner credentials from this same Secret at initdb; SP_DATABASE_URL is
        # what the application reads. One Secret serving both is why the owner
        # role and the DSN cannot drift apart.
        kubectl -n "${ns}" create secret generic "{{.NAME}}-db" \
          --type=kubernetes.io/basic-auth \
          --from-literal=username="{{.NAME}}" \
          --from-literal=password="${password}" \
          --from-literal=SP_DATABASE_URL="${dsn}"

        echo "created {{.NAME}}-app and {{.NAME}}-db in ${ns}"
        echo "render with: task kcl:apply PROFILE=existing-secrets -- ..."
    silent: true

  kcl:check:
    desc: "Every profile still renders — the check CI runs"
    cmds:
      # A profile that stops rendering is a deploy that fails at apply time
      # instead of here, so this walks all of them rather than one.
      - |
        set -e
        for p in kcl/profiles/*.yaml; do
          name=$(basename "${p}" .yaml)
          echo "rendering ${name}"
          task kcl:render PROFILE="${name}" > /dev/null
        done
        echo "all profiles render"
    silent: true

  kcl:kustomize:
    desc: "Render a kustomize base into DEST (PROFILE=base)"
    vars:
      PROFILE: '{{.PROFILE | default "base"}}'
      DEST: '{{.DEST | default "build/kustomize"}}'
    cmds:
      - |
        dagger call -m {{.KCL_MODULE}} render-kustomize-base \
          --source kcl \
          --parameters-file kcl/profiles/{{.PROFILE}}.yaml \
          export --path {{.DEST}}
        ls -1 {{.DEST}}
    silent: true

  kcl:publish:
    desc: "Push the kustomize base to GHCR under the same tag as the image"
    vars:
      PROFILE: '{{.PROFILE | default "base"}}'
      TAG: '{{.TAG | default .VERSION}}'
    cmds:
      - |
        set -e
        image="{{.IMAGE_REPO}}:{{.TAG}}"

        # An artefact whose Deployment names an image the registry does not
        # have is an ImagePullBackOff with a version number on it — harder to
        # read than an obvious failure. CI publishes the image on a push to
        # main, so a branch commit has none. Refuse rather than ship that.
        if command -v oras > /dev/null 2>&1; then
          if ! oras manifest fetch "${image}" > /dev/null 2>&1; then
            echo "no image ${image} in the registry." >&2
            echo "publish from a commit CI has built, or pass TAG=<an existing tag>." >&2
            exit 1
          fi
        else
          echo "oras not found — publishing without checking that ${image} exists" >&2
        fi

        # The image is pinned to the tag the artefact itself carries, so the
        # pair cannot drift. --parameters takes precedence over the profile,
        # whose :latest is a placeholder that does not resolve in this registry.
        dagger call -m {{.KCL_MODULE}} push-kustomize-base \
          --source kcl \
          --parameters-file kcl/profiles/{{.PROFILE}}.yaml \
          --parameters "config.image=${image}" \
          --address {{.KUSTOMIZE_OCI_REPO}} \
          --tag {{.TAG}} \
          --user env:GITHUB_USER \
          --password env:GITHUB_TOKEN
    silent: true
  psql:
    desc: "psql session on the development database"
    interactive: true
    cmds:
      - docker compose exec db psql -U schmetterpause -d schmetterpause

  # ----------------------------------------------------------- Documentation

  docs:index:
    desc: "Regenerate the ADR index from the ADRs themselves"
    sources:
      - docs/adr/[0-9]*.md
      - scripts/adr_index.sh
    generates:
      - docs/adr/index.md
    cmds:
      - sh scripts/adr_index.sh > docs/adr/index.md
      - echo "wrote docs/adr/index.md"
    silent: true

  docs:check:
    desc: "Check that the ADR index and the site nav still match docs/"
    cmds:
      - sh scripts/docs_test.sh
    silent: true

  docs:serve:
    desc: "Preview the site at http://localhost:8000 (Ctrl-C to stop)"
    cmds:
      # In a container, so nobody needs a Python environment for a preview.
      #
      # What it renders is close to the published site but not identical: the
      # shared Pages workflow replaces the theme block in mkdocs.yml with its
      # own. Layout, colours and the interface language are therefore worth
      # checking on the deployed site rather than here; content and nav are
      # the same in both.
      - |
        docker run --rm -it \
          -p 8000:8000 \
          -v "$(pwd):/docs" \
          squidfunk/mkdocs-material:9 serve --dev-addr 0.0.0.0:8000
    silent: true

  docs:build:
    desc: "Build the site into build/site"
    deps: [docs:check]
    cmds:
      - |
        docker run --rm \
          -v "$(pwd):/docs" \
          squidfunk/mkdocs-material:9 build --strict --site-dir build/site
      - echo "built build/site"
    silent: true

  # ------------------------------------------------------------ Development

  generate:
    desc: "Generate the templ templates"
    sources:
      - internal/templates/*.templ
    generates:
      - internal/templates/*_templ.go
    cmds:
      - go generate ./...

  fmt:
    desc: "Format the sources"
    cmds:
      - go tool templ fmt .
      - gofmt -w cmd internal web db
      - go mod tidy

  migrate:
    desc: "Apply migrations to the local database"
    env:
      SP_DATABASE_URL: '{{.DSN}}'
    cmds:
      - task: compose:up
        vars: { SERVICES: db }
      - go run ./cmd/schmetterpause migrate up

  migrate:status:
    desc: "Show the migration state"
    env:
      SP_DATABASE_URL: '{{.DSN}}'
    cmds:
      - go run ./cmd/schmetterpause migrate status

  test:
    desc: "Unit tests, local and fast"
    deps: [generate]
    cmds:
      - go test -race -cover ./...

  test:integration:
    desc: "Repository tests against their own database, which they empty"
    deps: [generate]
    env:
      SP_TEST_DATABASE_URL: '{{.DSN_TEST}}'
    cmds:
      - task: test:database
      # -p 1: both suites talk to the same database and empty it between
      # tests, so running the packages concurrently has them migrating and
      # truncating over each other.
      - go test -race -count=1 -p 1 ./internal/repository/... ./internal/scoring/...

  test:database:
    desc: "Create the database the integration tests empty, if it is not there"
    silent: true
    cmds:
      - |
        set -e

        # Start the server only when nothing is serving. "compose up db" from
        # the base file alone is not a no-op against a container the office
        # overlay started: compose sees a different configuration and recreates
        # it, which drops "restart: unless-stopped" and leaves a laptop that
        # reboots without its database. The data is on a volume and survives;
        # the settings do not (issue #163).
        if [ -z "$(docker compose ps --status running --quiet db)" ]; then
          docker compose up --detach --wait db
        fi

        # Postgres has no "create database if not exists", and createdb on an
        # existing one is an error rather than a no-op. Asking first is the
        # whole of it.
        exists=$(docker compose exec -T db psql -U schmetterpause -d postgres -tAc \
          "select 1 from pg_database where datname = '{{.TEST_DB}}'")
        if [ "$exists" = "1" ]; then
          echo "{{.TEST_DB}} is there."
        else
          docker compose exec -T db psql -U schmetterpause -d postgres \
            -c "create database {{.TEST_DB}} owner schmetterpause"
          echo "Created {{.TEST_DB}}. The tests migrate it themselves."
        fi

  # ------------------------------------------------------------------ Dagger
  # These tasks invoke the same pipeline that runs in CI.

  lint:
    desc: "Dagger lint: formatting, generated-code state, go vet, golangci-lint"
    deps: [dagger:check]
    cmds:
      - dagger call lint --source=.

  build:
    desc: "Dagger build: binary and image, emitted as an OCI artefact"
    deps: [dagger:check]
    cmds:
      - mkdir -p build
      - dagger call build --source=. --version={{.VERSION}} --commit-time="{{.COMMIT_TIME}}" export --path=build/schmetterpause-oci.tar
      - 'echo "OCI artefact: build/schmetterpause-oci.tar"'

  verify:
    desc: "Dagger verify: the built image against a fresh Postgres"
    deps: [dagger:check]
    cmds:
      - dagger call verify --source=. --version={{.VERSION}} --commit-time="{{.COMMIT_TIME}}"

  govulncheck:
    desc: "Dagger govulncheck: reachable vulnerabilities in the source"
    deps: [dagger:check]
    cmds:
      - dagger call govulncheck --source=.

  ci:
    desc: "lint + test + govulncheck + build + verify, identical to the pipeline"
    deps: [dagger:check]
    cmds:
      - dagger call ci --source=. --version={{.VERSION}} --commit-time="{{.COMMIT_TIME}}"

  publish:
    desc: "Push the image to ttl.sh so somebody can look at it — expires by itself"
    deps: [dagger:check]
    vars:
      TTL: '{{.TTL | default "1h"}}'
    cmds:
      - dagger call publish --source=. --version={{.VERSION}} --commit-time="{{.COMMIT_TIME}}" --ttl={{.TTL}}
      - 'echo "Expires in {{.TTL}}. ttl.sh is public — pull it, do not store anything in it."'

  release:
    desc: "Push the image to GHCR — needs GITHUB_TOKEN and GITHUB_USER"
    deps: [dagger:check]
    preconditions:
      - sh: '[ -n "$GITHUB_TOKEN" ]'
        msg: |
          GITHUB_TOKEN is not set. It needs write access to the package
          (scope write:packages, or the job token with packages: write).
      - sh: '[ -n "$GITHUB_USER" ]'
        msg: "GITHUB_USER is not set. Use the account the token belongs to."
    cmds:
      - >
        dagger call release
        --source=.
        --version={{.VERSION}}
        --commit-time="{{.COMMIT_TIME}}"
        --registry-token=env:GITHUB_TOKEN
        --username="$GITHUB_USER"

  dagger:develop:
    desc: "Generate the Dagger module scaffolding (needed once)"
    deps: [dagger:check]
    cmds:
      - dagger develop

  compose:up:
    internal: true
    # No VERSION or COMMIT_TIME here any more, and no --build below. Compose
    # runs the released image rather than building one, so the version is
    # already baked into what it pulls — passing a version in would only be a
    # second, quieter opinion about which one is running.
    #
    # Without this, task echoes the whole diagnostic block on every start,
    # which is precisely the noise it exists to remove.
    silent: true
    # "docker compose --wait" reports only that a container exited, never
    # why. The reason is one command away in the logs, which is one command
    # too many when a service refuses to start — so it is printed here.
    cmds:
      - |
        if docker compose up --detach --wait {{.SERVICES}}; then
          exit 0
        fi

        echo >&2
        echo "A service did not come up:" >&2
        echo >&2
        docker compose logs --no-log-prefix --tail 25 {{.SERVICES}} >&2
        echo >&2

        if docker compose logs {{.SERVICES}} 2>&1 | grep -q "incompatible with server"; then
          echo "The database volume was created by an older major version of" >&2
          echo "Postgres, which refuses to start on it. The development data is" >&2
          echo "throwaway data:" >&2
          echo >&2
          echo "    task down && task up" >&2
          echo >&2
        fi
        exit 1

  dagger:check:
    internal: true
    preconditions:
      - sh: command -v dagger >/dev/null
        msg: |
          The Dagger CLI is missing. It holds the pipeline logic, so lint,
          build, verify and ci do not run without it.
          Install: https://docs.dagger.io/install
      - sh: docker info >/dev/null 2>&1
        msg: "Docker is not running, and Dagger needs a container runtime."
