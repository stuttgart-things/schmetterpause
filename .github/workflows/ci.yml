# Deliberately thin: this workflow installs the Dagger CLI and calls the same
# function that "task ci" runs locally. It holds no build logic — that lives in
# dagger/main.go and behaves identically here and on a developer machine.
#
# The exceptions are three calls into shared workflows from
# stuttgart-things/github-workflow-templates, and none of them is build logic.
# The image scan reads an artefact that has already been published, so there is
# nothing about it to reproduce locally. Repository linting has an opinion
# about YAML and Markdown, which the Go pipeline has no business holding. The
# source scan is the one place the claim above is weaker: govulncheck reads
# this working tree, so it could have lived in "dagger call ci" — and now does,
# in addition, which is why that job says why it runs twice.
#
# See issue #85 for what else moves here and what does not: the container
# build via ko is a real decision rather than an adoption, and call-go-release
# is ruled out because it brings semantic-release with it (issue #39).
#
# The signing and verification jobs (sign-image, sign-kustomize,
# verify-artefacts — issue #230, ADR-0020) do not bend the rule above either,
# and the ADR says why at length. In short: they run after the push, about
# artefacts that already exist, which is the same class as the scan and
# verify-image-tags. The one thing they add that could not live in Dagger is
# an identity — the keyless signature is made with the runner's own OIDC
# token, which "task release" has no way to obtain and should not pretend to.
name: CI

on:
  push:
    branches: [main]
    # Kept for a tag pushed by a human, which does trigger a workflow. A tag
    # from release-please does NOT: GitHub suppresses triggers for events made
    # with the GITHUB_TOKEN, so that path arrives through workflow_dispatch
    # below instead. See issue #172.
    tags: ["v*"]
  pull_request:
  # release-please dispatches this at the tag it just created. Running AT the
  # tag rather than on main is the whole point: github.ref_type is then "tag",
  # so the release job below moves "latest" without needing a special case.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseding a branch build is fine. Cancelling a tag build is not: it can
  # leave a half-pushed manifest in the registry.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  DAGGER_VERSION: "0.21.8"
  # Same version the kcl module installs, so a tag written here and an
  # artefact pushed there cannot come from two different oras.
  ORAS_VERSION: "1.2.2"
  # Signing and SBOM (issue #230, ADR-0020). Downloaded rather than installed
  # by an action, for the same reason oras above is: one pinned version string
  # in this file beats a second supply chain of actions to keep pinned, and
  # the tool that vouches for our artefacts is a poor place to take a
  # dependency on somebody else's release tooling. The renovate comments are
  # read by a custom manager in renovate.json; without it they are prose.
  #
  # Held on cosign 2. 3 is a major release, and what it writes has to be
  # something Kyverno on the cluster still verifies — nothing here has checked
  # that, so renovate.json asks for approval on that bump.
  # renovate: datasource=github-releases depName=sigstore/cosign
  COSIGN_VERSION: "2.6.5"
  # The same scanner the scan job below runs, used here for a different
  # purpose: it already pulls the exact digest, so it can write the inventory
  # instead of a second tool pulling the image again. Not the same version:
  # the scan takes the shared workflow's default, 0.64.1, as a container
  # image, and there is no release binary to download for it — the trivy
  # release list has nothing between 0.26.0 and 0.69.2, and 0.61.0, which this
  # line first named, answers 404.
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  TRIVY_VERSION: "0.74.0"

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Version comes from git describe: needs tags and history.
          fetch-depth: 0

      - name: Install the Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | DAGGER_VERSION="${DAGGER_VERSION}" BIN_DIR=/usr/local/bin sudo -E sh
          dagger version

      - name: lint, test, build, verify
        run: |
          dagger call ci \
            --source=. \
            --version="$(git describe --tags --always --dirty)" \
            --commit-time="$(git show -s --format=%cI HEAD)"

  # yamllint and markdownlint over the whole repository. Neither has ever run
  # here, and neither belongs in "dagger call ci": that pipeline is about the
  # Go application, and a linter with an opinion about how a workflow file is
  # indented has nothing to say about whether the binary works. This is the
  # kind of adoption issue #85 asks for — a genuine reusable workflow rather
  # than a hand-rolled job.
  #
  # Report-only, and not by our choice: the shared workflow does not expose
  # the module's fail-on input, so it cannot gate no matter what is passed. A
  # findings file lands as an artefact and in the step summary; nothing turns
  # red. Same posture Trivy started from, for the same reason — a first run
  # over a repository nobody has linted is a measurement, not a verdict — and
  # if the findings turn out to be worth acting on, gating them needs a change
  # upstream rather than here.
  #
  # No config files. The module writes its own .yamllint and .mdlrc when the
  # repository has none, and those defaults are what this template was tuned
  # against; shipping ours would be a decision about rules taken before
  # reading a single finding. Both are inputs, so it stays a one-line change.
  #
  # Pinned like every other call here, at the same revision, so one Renovate
  # bump moves all three. @main would be defensible for a job that cannot
  # fail, but a repository with two digests for one dependency is worse than
  # the pin is strict.
  #
  # Deliberately no "needs": lint findings do not depend on a build, and a
  # failing test should not hide them.
  lint:
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-repository-linting.yaml@6c30aebec6599918de7ae33a83f4f54bbad5c2d4 # main
    with:
      runs-on: ubuntu-latest
      app-directory: "./"
      output-file: "/tmp/schmetterpause-findings.txt"
      # A pull request checks out the merge commit by default; the template
      # takes a ref and checks that out itself, so it has to be told which
      # branch the run is about. Without it every pull-request run would lint
      # main and report nothing about the change under review.
      branch-name: ${{ github.head_ref || github.ref_name }}

  # Artefacts that are meant to last go to GHCR.
  #
  # Pull requests now publish too, which reverses half of issue #20. Its rule
  # was "pushing every branch build somewhere permanent turns a registry into a
  # landfill", and the rule stands — what changed is that a PR artefact is not
  # permanent. cleanup-pr-artifacts.yml deletes every `pr-<n>-*` version when
  # the pull request closes, so the landfill is swept rather than tolerated.
  # The two are one change: publishing here without that workflow is the thing
  # #20 rejected. See issue #82.
  #
  # Still never from a fork. A fork's GITHUB_TOKEN is read-only, so the job
  # would fail rather than leak, but failing every outside contribution on a
  # step it cannot pass is its own kind of wrong.
  #
  # Not gated on the `preview` label. The label decides whether an environment
  # is spun up — that is the ApplicationSet's business — and gating the build
  # on it would mean labelling a pull request produces nothing until somebody
  # also pushes to it. Building for every PR also means the Trivy scan below
  # finally sees one, which is the gap its own comment complains about.
  release:
    if: >-
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ steps.publish.outputs.image-ref }}
      version: ${{ steps.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The head of the pull request, not the merge commit GitHub builds by
          # default. The tag this publishes under is `pr-<n>-<head sha>`,
          # because that is the string the preview ApplicationSet composes from
          # its own `.head_sha` — so building anything else would put a name on
          # an artefact that is not what the name says. Twice already
          # (#177, #179) this repository shipped a tag that did not identify
          # its artefact; both times it was invisible until digests were
          # compared by hand.
          #
          # Empty on push and workflow_dispatch, where checkout takes its
          # default.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install the Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | DAGGER_VERSION="${DAGGER_VERSION}" BIN_DIR=/usr/local/bin sudo -E sh
          dagger version

      - name: Publish to GHCR
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          commit_time="$(git show -s --format=%cI HEAD)"

          # A release build is named by its tag; a snapshot is named by its
          # commit, and the two namespaces must not touch.
          #
          # They did. `git describe --tags` returns the bare tag on the
          # commit the tag points at — which is the release commit, the one
          # main gets pushed. So the push-to-main run and the dispatched tag
          # run both published "v0.2.0", from separate builds that are not
          # bit-identical, and whichever finished last won the tag. It left
          # latest and v0.2.0 pointing at different images of the same
          # source: 543ed2b3 and f7832452. Nothing was broken for a reader,
          # but a tag that does not identify an artefact is not a tag.
          #
          # The short SHA is also what this repository tagged snapshots with
          # for its whole life before v0.1.0 existed, so nothing about the
          # naming changes — it only stops being derived from a tag that has
          # nothing to do with the commit being built.
          #
          # Only a tag moves "latest". A push to main is a snapshot, and
          # pointing latest at one would make it mean "most recent build"
          # rather than "most recent release".
          # A pull request is a third namespace beside the two above, and it
          # has to be spelled exactly this way: the preview ApplicationSet
          # composes `pr-{{ .number }}-{{ .head_sha }}` from the GitHub
          # pullRequest generator, with the FULL head sha rather than the
          # short one used for snapshots. A tag that is one character off is
          # an ImagePullBackOff in every preview namespace.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
            latest=true
          elif [ -n "${PR_NUMBER:-}" ]; then
            version="pr-${PR_NUMBER}-${PR_HEAD_SHA}"
            latest=false

            # The checkout above asked for the head sha; if it did not get it,
            # the tag would name a build of the merge commit instead. Cheap to
            # assert, and the failure is otherwise silent.
            head="$(git rev-parse HEAD)"
            if [ "${head}" != "${PR_HEAD_SHA}" ]; then
              echo "checked out ${head}, but the tag says ${PR_HEAD_SHA}" >&2
              exit 1
            fi
          else
            version="$(git rev-parse --short HEAD)"
            latest=false
          fi

          # dagger writes the function's result to stdout and its progress to
          # stderr, so the reference Publish returns can be captured here. It
          # carries the digest, which is what the scan below is handed: what
          # gets scanned is then exactly what was pushed, not whatever a
          # mutable tag points at by the time the scan runs.
          ref="$(dagger call release \
            --source=. \
            --version="${version}" \
            --commit-time="${commit_time}" \
            --registry-token=env:GITHUB_TOKEN \
            --username="${GITHUB_ACTOR}" \
            --latest="${latest}")"

          # Fail loudly rather than handing the scan something that is not a
          # reference. A silently empty output would leave the scan job
          # reporting on nothing while looking green.
          case "${ref}" in
            ghcr.io/*) ;;
            *)
              echo "release did not return an image reference: ${ref}" >&2
              exit 1
              ;;
          esac

          echo "published ${ref}"
          echo "image-ref=${ref}" >> "$GITHUB_OUTPUT"

          # The kustomize job publishes its artefact under this same string.
          # It is handed on rather than recomputed: "git describe" run twice
          # on two checkouts is two sources of truth for the one value that
          # ties the artefact to the image it names.
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  # Signs the image that was just published, and attaches its inventory to the
  # same digest. Issue #230, decided in ADR-0020.
  #
  # Three things about the shape of this job are decisions rather than
  # convenience, and all three are written up in the ADR:
  #
  # 1. **Keyless.** The job asks Actions for an OIDC token, Fulcio exchanges it
  #    for a certificate valid for ten minutes, and the certificate names this
  #    workflow file at this ref as the signer. Nothing is stored, so nothing
  #    has to be rotated and nothing can leak. The cost is a public record in
  #    the transparency log, which for a public package is not a cost.
  # 2. **In the workflow rather than in Dagger**, despite what this file says
  #    about holding no build logic. Signing is not build logic: it happens
  #    after the push, about an artefact that already exists, which is the same
  #    class as the scan and verify-image-tags jobs that already live here. The
  #    OIDC token is also the runner's, and handing it to Dagger would make
  #    `task release` look like it could do this when it cannot.
  # 3. **By digest, never by tag.** A tag is a name somebody can move; the
  #    signature has to be about one artefact. The release job already returns
  #    the digest for exactly this reason — the scan gets it so it reads what
  #    was pushed rather than whatever the tag points at by now.
  #
  # Blocking from the first run, unlike Trivy. The difference is not nerve: a
  # scan's verdict depends on what the world discovered overnight, so a first
  # run is a measurement. This job verifies nothing — it only asserts. If it
  # goes red, signing is broken, not the world.
  sign-image:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Writing the signature and the attestation means pushing two more
      # objects into the same package.
      packages: write
      # The whole of decision 1. Without it cosign has no identity to sign as.
      id-token: write
    outputs:
      # The digest reference everything downstream verifies, resolved once
      # here rather than re-derived by every job that needs it.
      target: ${{ steps.sign.outputs.target }}
    steps:
      - name: Install cosign and trivy
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" \
            -o "${RUNNER_TEMP}/bin/cosign"
          chmod +x "${RUNNER_TEMP}/bin/cosign"
          curl -fsSL \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar xz -C "${RUNNER_TEMP}/bin" trivy
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/bin/cosign" version
          "${RUNNER_TEMP}/bin/trivy" --version

      - name: Sign the digest, attach the SBOM
        id: sign
        env:
          REF: ${{ needs.release.outputs.image-ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Trivy pulls the image itself. The package is public, so this is
          # not strictly needed — but an anonymous pull is rate-limited and a
          # signing job that fails on somebody else's traffic is noise.
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # dagger returns "<repo>:<tag>@sha256:<digest>". Drop the tag: what
          # is signed is the digest, and leaving the tag in the reference
          # would put a mutable name into a record meant to be immutable.
          case "${REF}" in
            *@sha256:*) ;;
            *)
              echo "the release job returned ${REF}, which carries no digest" >&2
              exit 1
              ;;
          esac
          digest="${REF##*@}"
          repo="${REF%@*}"
          repo="${repo%:*}"
          target="${repo}@${digest}"
          echo "signing ${target}"

          printenv GITHUB_TOKEN \
            | cosign login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

          cosign sign --yes "${target}"

          # The inventory, as a CycloneDX predicate on the same digest.
          #
          # --platform is not a detail to skip: the release is one manifest
          # covering amd64 and arm64, and trivy resolves an index to the
          # platform it is running on. Naming it means the SBOM says which
          # half it describes instead of depending on what the runner was.
          # The arm64 image is the same source and the same base, so the two
          # inventories differ only in the architecture of their packages —
          # but that is a claim, and this file should not make it silently.
          trivy image \
            --quiet \
            --platform linux/amd64 \
            --format cyclonedx \
            --output "${RUNNER_TEMP}/sbom.cdx.json" \
            "${target}"

          cosign attest --yes \
            --type cyclonedx \
            --predicate "${RUNNER_TEMP}/sbom.cdx.json" \
            "${target}"

          echo "target=${target}" >> "$GITHUB_OUTPUT"

  # Trivy against the image that was just published. Blocking, as of the third
  # consecutive clean report: 7cca1ef, eb0abcc and 513a08d each came back with
  # zero HIGH/CRITICAL findings across both result classes — the debian base
  # packages and the Go binary. The first run was a measurement rather than a
  # verdict, and the measurement has now been taken three times, so leaving it
  # report-only would mean a scan nobody has to act on.
  #
  # fail-on-finding is what makes that true, and dropping continue-on-error
  # was not. Until dagger v0.129.0 the shared module could not fail on a
  # vulnerability at all: trivy exits 0 on findings, its exit code was thrown
  # away, and the summary meant to carry the verdict was parsing secrets
  # rather than vulnerabilities. An image with a CRITICAL scanned green; only
  # an image that could not be pulled failed. So between #183 and here this
  # job was blocking in name and reported success on exactly the case it
  # exists for.
  #
  # Runs wherever the release job publishes, which since #82 includes a pull
  # request from this repository. The gap this comment used to describe — a
  # vulnerable dependency caught on main rather than in review — is closed, and
  # it was closed as a side effect: the preview environments needed a per-PR
  # image, and a per-PR image is a thing that can be scanned. It did not need
  # #85's ko stage after all.
  #
  # No secrets are passed: the package is public, so the scan pulls
  # anonymously and the called workflow gets nothing from us. That is also
  # why @main is acceptable here — an upstream change to a report-only job
  # that holds no credentials cannot break a build or leak anything. A
  # workflow that gates or publishes deserves a pinned revision; see #85.
  scan:
    needs: release
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-dagger-trivy-image-scan.yaml@6c30aebec6599918de7ae33a83f4f54bbad5c2d4 # main
    with:
      runs-on: ubuntu-latest
      image-ref: ${{ needs.release.outputs.image-ref }}
      severity: HIGH,CRITICAL
      artifact-name: trivy-image-report
      fail-on-finding: true

  # govulncheck against the source, on every event — which is the point. The
  # image scan above only runs on a push, because a pull request publishes no
  # image, so a vulnerable dependency was caught on main rather than in
  # review. This closes that without needing a PR image build: govulncheck
  # reads source, publishes nothing and runs in seconds.
  #
  # Blocking, unlike Trivy was to begin with, and the difference is not nerve.
  # govulncheck does call-graph analysis: it stays quiet about a CVE in a
  # dependency whose affected function this code never calls, and reports only
  # what is reachable. A finding therefore means something is genuinely
  # exposed, which is what makes it gateable on day one where a whole-image
  # inventory is not.
  #
  # "dagger call ci" now runs the same check too, so on a push this scans
  # twice. Deliberate, and worth the duplicate: this job uploads the report as
  # an artefact and reports independently of lint and test, so a dependency
  # advisory is still visible on a run that failed for an unrelated reason.
  # The ci job is what makes "task ci" and CI agree; this job is what makes
  # the result readable afterwards.
  #
  # Pinned to a revision rather than @main. The Trivy call above can afford
  # @main because it holds none of our credentials and its findings were
  # advisory when it was written; this one gates, so an upstream change to it
  # can turn a build here red. That is the pinning decision issue #85 leaves
  # open, taken at the first call site where it costs something.
  #
  # Deliberately not "needs: ci": a dependency advisory is worth seeing even
  # when a lint run is failing, and nothing about the scan depends on a build.
  govulncheck:
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-dagger-govulncheck.yaml@6c30aebec6599918de7ae33a83f4f54bbad5c2d4 # main
    with:
      runs-on: ubuntu-latest
      working-directory: "."
      artifact-name: govulncheck-report
      fail-on-finding: true
      # Must track goVersion in dagger/main.go, and the first run showed why.
      # The template's input is a floor, not a pin: GOTOOLCHAIN is auto, so a
      # go.mod requiring something newer wins, but nothing raises the
      # toolchain above that requirement. go.mod says "go 1.26.0", so the scan
      # ran against the go1.26.0 standard library and failed with 20 reachable
      # vulnerabilities in it, every one "Fixed in: go1.26.1".
      #
      # The binary that ships is built from goImage, which is derived from
      # goVersion = "1.27", and contains none of them. The scan was answering
      # a question about a toolchain this project does not use. Reachability
      # analysis is only as accurate as the standard library it analyses.
      go-version: "1.27"

  # The Azure Container Apps configuration in terraform/ (issue #206): fmt,
  # validate and tflint in one shared workflow, the mocked tests in the other —
  # what "task tf:check" runs locally, plus tflint. Not in "dagger call ci",
  # whose business is the Go application, for the same reason repository
  # linting is not.
  #
  # Both workflows used to run at the repository root only, where there is no
  # configuration, and validate ran fmt without -check, so both would have been
  # green over nothing. github-workflow-templates#183 added working-directory
  # and fmt-check. Pinned at the same revision as every other call here, so one
  # Renovate bump moves all of them.
  #
  # environment-name is required by both and creates the environment on first
  # use. "linting" already exists, without protection rules, so borrowing it
  # creates nothing new.
  #
  # Terraform 1.14.8: tests/ uses mock_provider, which needs 1.7, and it is the
  # version "task tf:check" was verified with.
  terraform-validate:
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-validate-terraform.yaml@6c30aebec6599918de7ae33a83f4f54bbad5c2d4 # main
    with:
      runs-on: ubuntu-latest
      environment-name: linting
      terraform-version: "1.14.8"
      tflint-version: v0.55.1
      continue-error: false
      working-directory: terraform
      fmt-check: true

  terraform-test:
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-terraform-test.yaml@6c30aebec6599918de7ae33a83f4f54bbad5c2d4 # main
    with:
      runs-on: ubuntu-latest
      environment-name: linting
      terraform-version: "1.14.8"
      continue-error: false
      working-directory: terraform

  # The second half of what a release is: the image says how the application
  # runs, the kustomize base says how it is deployed. Issue #80 — until now
  # this existed only as "task kcl:publish" on somebody's laptop, which makes
  # a deploy depend on a person remembering, and on whatever their working
  # tree happened to contain.
  #
  # Same tag as the image, and that is load-bearing rather than tidy: an
  # environment pins one reference in its Argo Application, and the artefact
  # under that tag renders a Deployment naming the image under the same one.
  # The version is taken from the release job instead of recomputed, so the
  # two cannot disagree.
  #
  # Deliberately not "publish the base, then the image": the base names an
  # image, so publishing it first opens a window in which the artefact points
  # at something the registry does not have. "needs: release" closes it.
  # The two values a person publishing by hand uses, read out of the Taskfile
  # rather than repeated here. An artefact that CI renders from a different
  # module version than the one a developer can reproduce is the drift this
  # exists to remove — the reusable workflow below takes them as inputs, and
  # inputs cannot run shell, so they are resolved once here.
  kcl-meta:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kustomize-repo: ${{ steps.read.outputs.kustomize-repo }}
      image-repo: ${{ steps.read.outputs.image-repo }}
      kcl-module: ${{ steps.read.outputs.kcl-module }}
      parameters: ${{ steps.read.outputs.parameters }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Read them out of the Taskfile
        id: read
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail

          module="$(sed -n 's/^  KCL_MODULE: *//p' Taskfile.yml)"
          repo="$(sed -n 's/^  KUSTOMIZE_OCI_REPO: *//p' Taskfile.yml)"
          image_repo="$(sed -n 's/^  IMAGE_REPO: *//p' Taskfile.yml)"

          for name in module repo image_repo; do
            if [ -z "${!name}" ]; then
              echo "could not read ${name} from Taskfile.yml — has a var been renamed?" >&2
              exit 1
            fi
          done
          [ -n "${VERSION}" ] || { echo "the release job returned no version" >&2; exit 1; }

          # --parameters wins over the profile, whose config.image is a
          # ":latest" placeholder that resolves to the wrong revision in any
          # registry that has one.
          #
          # A pull request's artefact carries the seed Job; a release artefact
          # does not. It cannot be a patch in the consuming chart, because the
          # chart patches what the artefact contains and nothing can patch in a
          # resource that was never rendered — so the switch belongs here, at
          # the one place that knows which kind of artefact this is.
          #
          # An empty preview is a useless preview (issue #82), and this is what
          # keeps that fix out of every release: the Job exists in `pr-*` and
          # nowhere else. Should a `pr-*` artefact ever be deployed somewhere
          # real, the binary still refuses a database that has players.
          parameters="config.image=${image_repo}:${VERSION}"
          case "${VERSION}" in
            pr-*) parameters="${parameters},config.seedEnabled=true" ;;
          esac

          {
            echo "kustomize-repo=${repo}"
            echo "image-repo=${image_repo}"
            echo "kcl-module=${module}"
            echo "parameters=${parameters}"
          } >> "$GITHUB_OUTPUT"

  # Renders the base, pushes it, moves "latest" with `oras tag` on the digest
  # just pushed, and proves the tags agree. That was ~120 inline lines here
  # until github-workflow-templates gained kcl-parameters (#169),
  # additional-tags (#170) and ref (#173) — the three things this repository
  # needed that the shared workflow could not express.
  kustomize:
    needs: [release, kcl-meta]
    # The workflow-level default is `contents: read`, and a called workflow can
    # only ever have the permissions of the job that calls it — so dropping
    # this block when the inline job became a `uses:` made the whole run fail
    # to start, with no log to say why. The called workflow needs
    # `packages: write` to push to GHCR.
    permissions:
      contents: read
      packages: write
    uses: stuttgart-things/github-workflow-templates/.github/workflows/call-push-kustomize.yaml@6c30aebec6599918de7ae33a83f4f54bbad5c2d4 # main
    with:
      runs-on: ubuntu-latest
      # The head of the pull request, not the merge commit GitHub builds by
      # default. The tag published is `pr-<n>-<head sha>`, the string the
      # preview ApplicationSet composes from its own `.head_sha`, so building
      # anything else puts a name on an artefact that is not what the name
      # says. Twice already (#177, #179) this repository shipped exactly that.
      ref: ${{ github.event.pull_request.head.sha }}
      kcl-source-dir: kcl
      kcl-profile-file: kcl/profiles/base.yaml
      kcl-parameters: ${{ needs.kcl-meta.outputs.parameters }}
      kustomize-oci-repo: ${{ needs.kcl-meta.outputs.kustomize-repo }}
      tag: ${{ needs.release.outputs.version }}
      # Only a tag moves "latest". A push to main is a snapshot, and pointing
      # latest at one would make it mean "most recent build" rather than "most
      # recent release" — the rule the image already follows.
      additional-tags: ${{ github.ref_type == 'tag' && 'latest' || '' }}
      dagger-kcl-module: ${{ needs.kcl-meta.outputs.kcl-module }}
    secrets: inherit # pragma: allowlist secret

  # The other artefact, and the one #194 singles out: the manifest set is what
  # Argo consumes, so it is the one an attacker would rather have. An image
  # signature on its own protects the half nobody would bother attacking.
  #
  # A step *after* the shared workflow rather than a change *inside* it. The
  # push goes through github-workflow-templates, which this repository does not
  # own, so the two artefacts do not get signed in the same place — which the
  # issue allows "as long as it is noticed rather than discovered". This
  # comment is the noticing. If the shared workflow ever grows signing of its
  # own, this job is what should go.
  #
  # No SBOM here. A CycloneDX inventory of a rendered manifest set would list
  # nothing a reader does not already get by pulling the artefact and looking
  # at it — the dependency it does have, the image, carries its own.
  sign-kustomize:
    needs: [release, kcl-meta, kustomize]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      target: ${{ steps.sign.outputs.target }}
    steps:
      - name: Install oras and cosign
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C "${RUNNER_TEMP}/bin" oras
          curl -fsSL \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" \
            -o "${RUNNER_TEMP}/bin/cosign"
          chmod +x "${RUNNER_TEMP}/bin/cosign"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Sign the manifest artefact
        id: sign
        env:
          REPO: ${{ needs.kcl-meta.outputs.kustomize-repo }}
          VERSION: ${{ needs.release.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          printenv GITHUB_TOKEN \
            | oras login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          printenv GITHUB_TOKEN \
            | cosign login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

          # The shared workflow returns no digest, so it is resolved from the
          # tag it just pushed. That is a tag read, which is the thing the
          # image side is careful to avoid — the window is the seconds between
          # that job finishing and this one starting, and only a second push
          # to the same tag in that window could move it. Concurrency for this
          # ref is already serialised at the top of this file, so the only
          # writer that could is a human with a token. Worth a sentence rather
          # than a mechanism; if the shared workflow ever returns a digest,
          # take it instead of this.
          digest="$(oras manifest fetch --descriptor "${REPO}:${VERSION}" \
            | sed 's/.*"digest":"\([^"]*\)".*/\1/')"
          case "${digest}" in
            sha256:*) ;;
            *)
              echo "could not resolve a digest for ${REPO}:${VERSION}, got ${digest}" >&2
              exit 1
              ;;
          esac

          target="${REPO}@${digest}"
          echo "signing ${target}"
          cosign sign --yes "${target}"
          echo "target=${target}" >> "$GITHUB_OUTPUT"

  # The kustomize side of this is now proved inside the shared workflow. The
  # image side is not: its "latest" is moved by the release job, so somebody
  # has to check that one too, and it stays here rather than disappearing with
  # the inline job that used to do both.
  #
  # Both times this drifted it was invisible until digests were compared by
  # hand, and both tags reported success while disagreeing (#177, #179).
  verify-image-tags:
    if: github.ref_type == 'tag'
    needs: [release, kcl-meta]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: latest and the version must be one image
        env:
          # ORAS_VERSION is inherited from the workflow-level env above.
          REPO: ${{ needs.kcl-meta.outputs.image-repo }}
          VERSION: ${{ needs.release.outputs.version }}
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C "${RUNNER_TEMP}/bin" oras
          export PATH="${RUNNER_TEMP}/bin:${PATH}"

          printenv GITHUB_TOKEN \
            | oras login "${REPO%%/*}" --username "${GITHUB_USER}" --password-stdin

          digest() {
            oras manifest fetch --descriptor "$1" \
              | sed 's/.*"digest":"\([^"]*\)".*/\1/'
          }

          v="$(digest "${REPO}:${VERSION}")"
          l="$(digest "${REPO}:latest")"
          if [ "${v}" != "${l}" ]; then
            echo "${REPO}: latest is ${l}, ${VERSION} is ${v} — the release tag does not identify the artefact" >&2
            exit 1
          fi
          echo "${REPO}: latest and ${VERSION} agree on ${v}"

  # The point of all of the above, and the reason #230 is one issue rather
  # than three.
  #
  #   > Signing without verification repeats exactly the failure this phase
  #   > opens with: a mechanism that looks like coverage and asserts nothing.
  #
  # This job is the gate in the delivery path. It is deliberately not the only
  # verification: an admission policy on the cluster checks the image the
  # kubelet is about to run, which is a stronger claim than anything CI can
  # make about what it published (policy/verify-image-signature.yaml). But
  # admission never sees the manifest artefact — Argo pulls that, the kubelet
  # does not — so for one of the two artefacts this job is all there is.
  #
  # Blocking from the first run. The Trivy precedent of three report-only runs
  # does not transfer: Trivy's verdict depends on what the world discovered
  # overnight, so its first run was a measurement. This one checks a signature
  # that a job in this same run made ninety seconds earlier. A red result
  # means signing or verification is broken, and there is no reading of that
  # where the right response is a report nobody has to act on.
  #
  # Azure Container Apps is out of scope, and that is a decision rather than
  # an oversight: it has no admission control at all (#206) and the
  # environment is temporary (ADR-0016). What runs there is verified here and
  # nowhere else. ADR-0020 says so in one sentence, because "silently covering
  # one of two environments" is the failure this phase opens with, one level
  # up.
  verify-artefacts:
    needs: [sign-image, sign-kustomize]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      # The two halves of "signed by us". The issuer says the certificate came
      # from GitHub's OIDC provider; the identity says which workflow file, in
      # which repository, asked for it. Neither alone is worth much — anybody
      # can get a certificate from that issuer.
      #
      # A regexp rather than a literal because the ref differs by event:
      # refs/heads/main on a push, refs/tags/v0.8.0 on a release, and
      # refs/pull/<n>/merge for a preview build. It is anchored and escaped, so
      # it will not match a fork or a repository whose name starts the same
      # way. Kept in step with policy/verify-image-signature.yaml and
      # docs/supply-chain.md; all three name the same two strings.
      COSIGN_ISSUER: https://token.actions.githubusercontent.com
      COSIGN_IDENTITY: ^https://github\.com/stuttgart-things/schmetterpause/\.github/workflows/ci\.yml@refs/
    steps:
      - name: Install cosign
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL \
            "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64" \
            -o "${RUNNER_TEMP}/bin/cosign"
          chmod +x "${RUNNER_TEMP}/bin/cosign"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"

      - name: Both artefacts are signed by this workflow
        env:
          IMAGE: ${{ needs.sign-image.outputs.target }}
          KUSTOMIZE: ${{ needs.sign-kustomize.outputs.target }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Both packages are public, so this changes nothing about what can
          # be read — it takes the job off the anonymous rate limit, which is
          # shared with everything else leaving this runner.
          printenv GITHUB_TOKEN \
            | cosign login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

          for target in "${IMAGE}" "${KUSTOMIZE}"; do
            [ -n "${target}" ] || { echo "a signing job returned no target" >&2; exit 1; }
            echo "::group::verify ${target}"
            cosign verify \
              --certificate-oidc-issuer "${COSIGN_ISSUER}" \
              --certificate-identity-regexp "${COSIGN_IDENTITY}" \
              "${target}" > /dev/null
            echo "::endgroup::"
            echo "${target}: signed by this workflow"
          done

          echo "::group::verify the SBOM attestation"
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-oidc-issuer "${COSIGN_ISSUER}" \
            --certificate-identity-regexp "${COSIGN_IDENTITY}" \
            "${IMAGE}" > /dev/null
          echo "::endgroup::"
          echo "${IMAGE}: carries an SBOM attestation signed by this workflow"

      # A verification that has never refused anything is indistinguishable
      # from one that cannot. The issue asks for that proof as a drill — push
      # something unsigned and watch the gate refuse it — and the drill against
      # the cluster is written down in docs/supply-chain.md, because it needs a
      # cluster. This is the half that can run on every build: the same
      # command, against an identity that must not match, asserting that it
      # fails.
      #
      # It catches the failure the drill is for. A cosign invocation with a
      # misspelled flag, or a --certificate-identity-regexp that accidentally
      # matches everything, passes the step above and would pass it forever.
      # Here it turns the build red.
      - name: And it refuses an identity that is not ours
        env:
          IMAGE: ${{ needs.sign-image.outputs.target }}
        run: |
          set -euo pipefail

          if cosign verify \
            --certificate-oidc-issuer "${COSIGN_ISSUER}" \
            --certificate-identity-regexp '^https://github\.com/stuttgart-things/not-this-repository/' \
            "${IMAGE}" > /dev/null 2>&1; then
            echo "verification accepted a signature from an identity that is not ours" >&2
            echo "the gate above is not a gate" >&2
            exit 1
          fi
          echo "refused an identity that is not ours, as it must"
