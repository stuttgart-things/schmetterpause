# Deliberately thin: this workflow installs the Dagger CLI and calls the same
# function that "task ci" runs locally. It holds no build logic — that lives in
# dagger/main.go and behaves identically here and on a developer machine.
name: CI

on:
  push:
    branches: [main]
    # Tags trigger the release job below; without this, "latest" would never
    # move and the tag would never reach the registry.
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseding a branch build is fine. Cancelling a tag build is not: it can
  # leave a half-pushed manifest in the registry.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  DAGGER_VERSION: "0.21.8"

jobs:
  # Pull requests stop after the checks. The image they build is pushed to
  # ttl.sh, which needs no token — so this job also works from a fork, and it
  # expires on its own.
  ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Version comes from git describe: needs tags and history.
          fetch-depth: 0

      - name: Install the Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | DAGGER_VERSION="${DAGGER_VERSION}" BIN_DIR=/usr/local/bin sudo -E sh
          dagger version

      - name: lint, test, build, verify, scan
        run: |
          dagger call ci \
            --source=. \
            --version="$(git describe --tags --always --dirty)"

  # Artefacts that are meant to last go to GHCR. Only on a push — a pull
  # request from a fork must not be able to write to the package, and there is
  # nothing to keep from a branch that may never merge. See issue #20.
  #
  # This runs the same checks as the ci job and then copies the image it built
  # to GHCR: the digest that was verified and scanned is the one that ships.
  # That is why there is no separate ci job here to depend on — a second job
  # would have to build the image again, and would then promote something no
  # step of this run ever looked at.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install the Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | DAGGER_VERSION="${DAGGER_VERSION}" BIN_DIR=/usr/local/bin sudo -E sh
          dagger version

      - name: Pipeline, then promote to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(git describe --tags --always --dirty)"

          # Only a tag moves "latest". A push to main is a snapshot, and
          # pointing latest at one would make it mean "most recent build"
          # rather than "most recent release".
          latest=false
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            latest=true
          fi

          dagger call release \
            --source=. \
            --version="${version}" \
            --registry-token=env:GITHUB_TOKEN \
            --username="${GITHUB_ACTOR}" \
            --latest="${latest}"
