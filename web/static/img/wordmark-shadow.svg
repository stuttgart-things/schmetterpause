<!-- SCHMETTERPAUSE in a 5x7 pixel grid, 83x7 units, one unit per pixel.

     Two paths on purpose. The first carries the twelve letters and takes
     currentColor, so the mark inherits its colour from whatever it sits in:
     the fg token on screen, the print block's black on paper, with nothing
     to switch. The second carries only the double T, the one place in the
     name that also reads as "table tennis"; the custom property wordmark-tt
     colours it, and the fallback is the mascot's orange so the file is
     correct on its own.

     shape-rendering="crispEdges" is load bearing: without it the renderer
     antialiases the pixel edges and the whole point of the mark is gone.
     Below about 14px the one unit gap between letters falls under a device
     pixel and the letters run together.

     A third path carries the pixel shadow, one unit down and right, in the
     line token. It needs size to read: not below about 28px. -->
